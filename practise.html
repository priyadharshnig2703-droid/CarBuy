    }
}

    }

}

// 6. Find the product of numbers from 1 to N
function productNumbers(n) {
    let product = 1;

    }

}

function isPalindrome(n) {

    while (n > 0) {

// 20. Count how many times a digit appears
function countDigit(n, target) {
    if (n < 0) {
        n = -n;
    }
    let count = 0;
    if (n === 0 && target === 0) {
        return 1;
    }
    while (n > 0) {
        let digit = n % 10;

        if (digit === target) {
            count++;
        }
        n = Math.floor(n / 10);
    }
    return count;
}

    let result = "";

            if (result[j] === arr1[i]) {
                found = true;
            }
        }
         if (!found) {
            result[index] = arr1[i];
            index++;
        }
    }for (let i = 0; i < arr2.length; i++) {
        let found = false;

        for (let j = 0; j < result.length; j++) {
            if (result[j] === arr2[i]) {

            }
        }
        if (!found) {

// 79. Rotate array left by one
function rotateLeftOne(arr) {
    let result = [];
    if (arr.length === 0) {
        return result;
    }
    for (let i = 1; i < arr.length; i++) {
        result[i - 1] = arr[i];
    }
    result[arr.length - 1] = arr[0];
    return result;
}

// 80. Rotate array right by one
function rotateRightOne(arr) {
    let result = [];
    if (arr.length === 0) {
        return result;
    }
    result[0] = arr[arr.length - 1];

    for (let i = 0; i < arr.length - 1; i++) {
        result[i + 1] = arr[i];
    }
    return result;
}

// 81. Rotate array left by K positions
function rotateLeftK(arr, k) {
    let result = [];
    if (arr.length === 0) {
        return result;
    }
    k = k % arr.length;
    let index = 0;
    for (let i = k; i < arr.length; i++) {
        result[index] = arr[i];
        index++;
    }
    for (let i = 0; i < k; i++) {
        result[index] = arr[i];
        index++;
    }
    return result;
}

// 82. Split array into chunks
function chunkArray(arr, k) {
    let result = [];
    let resultIndex = 0;

    for (let i = 0; i < arr.length; i = i + k) {
        let chunk = [];
        let chunkIndex = 0;

        for (let j = i; j < i + k && j < arr.length; j++)
         {
            chunk[chunkIndex] = arr[j];
            chunkIndex++;
        }
        result[resultIndex] = chunk;
        resultIndex++;
    }
    return result;
}

// 83. Find pair whose sum equals target
function findPairWithSum(arr, target) {
    for (let i = 0; i < arr.length; i++) {
        for (let j = i + 1; j < arr.length; j++) {
            if (arr[i] + arr[j] === target) {
                return [arr[i], arr[j]];
            }
        }
    }

    return null;
}

// 84. Find all unique pairs whose sum equals target
function allPairsWithSum(arr, target) {
    let result = [];
    let index = 0;
    for (let i = 0; i < arr.length; i++) {
        for (let j = i + 1; j < arr.length; j++) {
            if (arr[i] + arr[j] === target) {
                result[index] = [arr[i], arr[j]];
                index++;
            }
        }
    }
    return result;
}

// 85. Pair with smallest absolute difference
function smallestDifferencePair(arr) {
    let bestPair = null;
    let smallestDifference = Infinity;
    for (let i = 0; i < arr.length; i++) {
        for (let j = i + 1; j < arr.length; j++) {
            let difference = arr[i] - arr[j];
            if (difference < 0) {
                difference = -difference;
            }
            if (difference < smallestDifference) {
                smallestDifference = difference;
                bestPair = [arr[i], arr[j]];
            }
        }
    }
    return bestPair;
}

// 86. Find three numbers whose sum equals target
function threeSum(arr, target) {
    for (let i = 0; i < arr.length; i++) {
        for (let j = i + 1; j < arr.length; j++) {
            for (let k = j + 1; k < arr.length; k++) {
                if (arr[i] + arr[j] + arr[k] === target) {
                    return [arr[i], arr[j], arr[k]];
                }
            }
        }
    }
    return null;
}

// 87. Maximum product of any two numbers
function maxProductTwo(arr) {
    let largest = arr[0] * arr[1];
    for (let i = 0; i < arr.length; i++) {
        for (let j = i + 1; j < arr.length; j++) {
            let product = arr[i] * arr[j];
            if (product > largest) {
                largest = product;
            }
        }
    }
    return largest;
}

// 88. Maximum product of any three numbers
function maxProductThree(arr) {
    let largest = arr[0] * arr[1] * arr[2];
    for (let i = 0; i < arr.length; i++) {
        for (let j = i + 1; j < arr.length; j++) {
            for (let k = j + 1; k < arr.length; k++) {
                let product = arr[i] * arr[j] * arr[k];
                if (product > largest) {
                    largest = product;
                }
            }
        }
    }

    return largest;
}

// 89. Find missing number from 1 to N
function missingNumber(arr, n) {
    let expectedSum = 0;
    let actualSum = 0;
    for (let i = 1; i <= n; i++) {
        expectedSum = expectedSum + i;
    }
    for (let i = 0; i < arr.length; i++) {
        actualSum = actualSum + arr[i];
    }
    return expectedSum - actualSum;
}

// 90. Find first repeated value
function firstRepeated(arr) {
    for (let i = 0; i < arr.length; i++) {
        for (let j = 0; j < i; j++) {
            if (arr[i] === arr[j]) {
                return arr[i];
            }
        }
    }
    return undefined;
}

// 91. Find first non-repeated value
function firstNonRepeated(arr) {
    for (let i = 0; i < arr.length; i++) {
        let count = 0;
        for (let j = 0; j < arr.length; j++) {
            if (arr[i] === arr[j]) {
                count++;
            }
        }
        if (count === 1) {
            return arr[i];
        }
    }
    return undefined;
}

// 92. Find longest consecutive run
function longestRun(arr) {
    if (arr.length === 0) {
        return {
            value: undefined,
            length: 0
        };
    }
    let currentValue = arr[0];
    let currentLength = 1;
    let bestValue = arr[0];
    let bestLength = 1;
    for (let i = 1; i < arr.length; i++) {
        if (arr[i] === currentValue) {
            currentLength++;
        } else {
            currentValue = arr[i];
            currentLength = 1;
        }
        if (currentLength > bestLength) {
            bestLength = currentLength;
            bestValue = currentValue;
        }
    }
    return {
        value: bestValue,
        length: bestLength
    };
}

// 93. Find longest increasing contiguous segment
function longestIncreasing(arr) {
    if (arr.length === 0) {
        return 0;
    }
    let current = 1;
    let longest = 1;
    for (let i = 1; i < arr.length; i++) {
        if (arr[i] > arr[i - 1]) {
            current++;
        } else {
            current = 1;
        }

        if (current > longest) {
            longest = current;
        }
    }
    return longest;
}

// 94. Find longest decreasing contiguous segment
function longestDecreasing(arr) {
    if (arr.length === 0) {
        return 0;
    }
    let current = 1;
    let longest = 1;
    for (let i = 1; i < arr.length; i++) {
        if (arr[i] < arr[i - 1]) {
            current++;
        } else {
            current = 1;
        }
        if (current > longest) {
            longest = current;
        }
        return longest;
}

// 95. Merge two sorted arrays
function mergeSortedArrays(arr1, arr2) {
    let result = [];
    let i = 0;
    let j = 0;
    let index = 0;
    while (i < arr1.length && j < arr2.length) {
        if (arr1[i] <= arr2[j]) {
            result[index] = arr1[i];
            i++;
        } else {
            result[index] = arr2[j];
            j++;
        }
        index++;
    }
    while (i < arr1.length) {
        result[index] = arr1[i];
        i++;
        index++;
    }
    while (j < arr2.length) {
        result[index] = arr2[j];
        j++;
        index++;
    }
    return result;
}

// 96. Find median without built-in sorting
function median(arr) {
    let sorted = insertionSort(arr);
    let middle = Math.floor(sorted.length / 2);
    if (sorted.length % 2 !== 0) {
        return sorted[middle];
    } else {
        return (sorted[middle - 1] + sorted[middle]) / 2;
    }
}

// 97. Bubble sort
function bubbleSort(arr) {
    let result = copyArray(arr);
    for (let i = 0; i < result.length - 1; i++) {
        for (let j = 0; j < result.length - 1 - i; j++) {

                let temp = result[j];
                result[j] = result[j + 1];
                result[j + 1] = temp;

// 98. Selection sort
function selectionSort(arr) {
    let result = copyArray(arr);
     for (let i = 0; i < result.length; i++) {
        let smallestIndex = i;
        for (let j = i + 1; j < result.length; j++) {
            if (result[j] < result[smallestIndex]) {
                smallestIndex = j;
            }
        }
        let temp = result[i];
        result[i] = result[smallestIndex];
        result[smallestIndex] = temp;
    }
    return result;
}

// 99. Insertion sort
function insertionSort(arr) {
    let result = copyArray(arr);
    for (let i = 1; i < result.length; i++) {
        let current = result[i];
        let j = i - 1;

        while (j >= 0 && result[j] > current) {
            result[j + 1] = result[j];
            j--;
        }
        result[j + 1] = current;
    }
    return result;
}

// 100. Find position where target should be inserted
function insertPosition(arr, target) {
    for (let i = 0; i < arr.length; i++) {
        if (arr[i] >= target) {
            return i;
        }
    }
    return arr.length;
}
