    width:100px;

}

</head>
<body>
    <h2>Task 1</h2>

<p class="p1">Apple</p>
<p class="p1">Orange</p>
<p class="p1">Mango</p>

<p class="p2">Red</p>

<h2>Task 2</h2>

<hr>

<h2 class="title">HTML</h2>
<h2 class="title">CSS</h2>

<h2>Task 10</h2>

<div class="card">HTML</div>
<div class="card">CSS</div>
<div class="card">JavaScript</div>

<button onclick="design()">Design</button>

<script>
    function copyText() {

    const p1 = document.querySelectorAll(".p1");
    const p2 = document.querySelectorAll(".p2");

    p1.forEach((item, index) => {
        item.textContent = p2[index].textContent;
    });

}

function changeBorder() {

    const boxes = document.querySelectorAll(".box");

    boxes.forEach((box) => {

        box.style.border = "5px solid red";
        box.style.borderRadius = "20px";

    });

}

function change() {

    const items = document.querySelectorAll(".item");

    items.forEach((item, index) => {

        if (index % 2 === 0) {
            item.style.backgroundColor = "yellow";
        } else {
            item.style.backgroundColor = "pink";
        }

    });

}

function hide() {

    const titles = document.querySelectorAll(".title");

    titles.forEach((title, index) => {

        if (index % 2 !== 0) {
            title.style.display = "none";
        }

    });

}

function increase() {

    const texts = document.querySelectorAll(".text");

    texts.forEach((text) => {

        text.style.fontSize = "40px";
        text.style.fontWeight = "bold";

    });

}

function changeImage() {

    const image = document.querySelector(".img");

    image.src = "https://hips.hearstapps.com/clv.h-cdn.co/assets/16/18/gettyimages-586890581.jpg?crop=0.668xw:1.00xh;0.219xw,0";

}

function changeLink() {

    const link = document.querySelector(".link");

    link.textContent = "YouTube";
    link.href = "https://youtube.com";

}

function changeValue() {

    const input = document.querySelector(".name");

    input.value = "Full Stack Developer";

}
function colour() {

    const boxes = document.querySelectorAll(".color");

    const colours = ["red", "green", "blue"];

    boxes.forEach((box, index) => {

        box.style.backgroundColor = colours[index % 3];

    });
                                                                                                                                                                                                                                                                                queueMicrotaskq
}

function design() {

    const cards = document.querySelectorAll(".card");

    cards.forEach((card) => {

        card.style.width = "200px";
        card.style.padding = "20px";
        card.style.border = "2px solid black";
        card.style.borderRadius = "15px";
        card.style.backgroundColor = "lightblue";
        card.style.color = "black";
        card.style.textAlign = "center";
        card.style.margin = "20px";

    });

}
</script>

    
</body>
</html>
