        /*Task 1: Basic Promise

Goal

Create a Promise that resolves after 2 seconds.

Requirements

Create a new Promise.
Wait for 2 seconds using setTimeout().
Resolve with "Download Complete".
Print the result using .then().
Expected Output

Downloading... (wait 2 seconds) Download Complete*/ 
function newPromise() 
{
    return new Promise((resolve, reject) => {
        setTimeout(() => {
            resolve("Download Complete");
        }, 2000);
    });
}
newPromise()
.then((result) => {
    console.log(result);
});

/*Task 2: Promise Reject

Goal

Handle success and failure.

Requirements

Create a Promise.
Generate a random number.
If the number is greater than 5, resolve with:
Login Successful
Otherwise reject with:

Invalid Credentials
Use:

.then()
.catch()
.finally()*/

function newPromise() {
    return new Promise((resolve, reject) => {
        let random = Math.floor(Math.random() * 10) + 1;
        console.log(random);
        if(random > 5) {
            resolve("Login Successful");
        }
        else {
            reject("Invalid Credentials");
        }
    });
}
newPromise()
.then((result) => {
    console.log(result);
})
.catch((error) => {
    console.log(error);
})
.finally(() => {
    console.log("Login process completed");
});
