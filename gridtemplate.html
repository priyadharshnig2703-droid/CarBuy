<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }
body{
    width: 100%;
    height: 100vh;
}

.container{
display: grid;
grid-template-columns: repeat(3,1fr);
grid-template-rows: 33vh 33vh 33vh;
grid-template-areas: 
"h1 h2 h2 h3"
"h1 h6 h7 h8"
"h1 h10 h11 h8";
gap: 10px;
 }

.box{
    background-color: aquamarine;
    color: black;
    display: grid;
    justify-content: center; 
    align-items: center;
    width: 200px;
    height: 200px;
}

.box:nth-child(1){
    grid-area: h1;
}
.box:nth-child(2){
    grid-area: h2;
}
.box:nth-child(3){
    grid-area: h3;
}
.box:nth-child(4){
    grid-area: h4;
}
.box:nth-child(5){
    grid-area: h5;
}
.box:nth-child(6){
    grid-area: h6;
}
.box:nth-child(7){
    grid-area: h7;
}
.box:nth-child(8){
    grid-area: h8;
}
.box:nth-child(9){
    grid-area: h9;
}
.box:nth-child(10){
    grid-area: h10;
}
.box:nth-child(11){
    grid-area: h11;
}
.box:nth-child(12){
    grid-area: h12;
}


</style>
<body>
<div class="container">
<div class="box">1</div>
<div class="box">2</div>
<div class="box">3</div>
<div class="box">4</div>
<div class="box">5</div>
<div class="box">6</div>
<div class="box">7</div>
<div class="box">8</div>
<div class="box">9</div>
<div class="box">10</div>
<div class="box">11</div>
<div class="box">12</div>
</div>
</body>
</html>
