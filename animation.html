<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    @keyframes run{
        0%{
            left: 0px;
        }
        50%{
            left: 200px;
        }
        80%{
            left: 100px;

        }
        100%{
            left: 0px;
        }
    }
    .fly{
        width: 100px;
    height: 100px;
        position: absolute;
        animation: run 5s linear infinite;
      
    }
</style>
<body>
    <div class="fly">
        <img src="https://img.magnific.com/premium-psd/colorful-butterfly-realistic-isolated-transparent-background-png-file_1304044-3924.jpg?semt=ais_hybrid&w=740&q=80" alt="">
    </div>
    
</body>
</html>
