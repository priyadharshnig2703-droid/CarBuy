    <script>
        //string - count character
        function countChar(s, ch) {
  let count = 0;
  for (let i = 0; i < s.length; i++) {
    if (s[i] === ch) {
      count++;
    }
  }
   return count;
}
console.log(countChar("banana", "a")); 

// with build in function
function countChar(s, ch) {
  return s.split(ch).length - 1;
}

console.log(countChar("banana", "a"));
